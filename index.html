<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos-DJ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f4f6;
    color:#1f2937;
    padding-bottom:40px;
}

header{
    background:#111827;
    color:white;
    padding:22px 18px;
}

header h1{
    font-size:24px;
    margin-bottom:5px;
}

header p{
    color:#d1d5db;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:16px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:bold;
    color:#374151;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    background:white;
}

input[readonly]{
    background:#f3f4f6;
    font-weight:bold;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#2563eb;
    color:white;
    width:100%;
    margin-top:14px;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.filters{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr auto;
    gap:10px;
    align-items:end;
}

.resumo{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.resumo-box{
    border-radius:12px;
    padding:15px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
}

.resumo-box span{
    display:block;
    font-size:12px;
    color:#6b7280;
    margin-bottom:6px;
}

.resumo-box strong{
    font-size:19px;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.projeto{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    background:#fff;
}

.projeto-topo{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.projeto h3{
    font-size:17px;
    margin-bottom:5px;
}

.servico-projeto{
    color:#2563eb;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.detalhes-servico{
    color:#4b5563;
    font-size:13px;
    margin-bottom:4px;
}

.data{
    color:#6b7280;
    font-size:13px;
}

.valores{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
}

.valor-box{
    background:#f9fafb;
    padding:10px;
    border-radius:8px;
}

.valor-box small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:4px;
}

.valor-box strong{
    font-size:14px;
}

.acoes{
    margin-top:12px;
    display:flex;
    justify-content:flex-end;
}

.vazio{
    text-align:center;
    padding:30px 10px;
    color:#6b7280;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .resumo{
        grid-template-columns:1fr;
    }

    .valores{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="container">
        <h1>Projetos-DJ</h1>
        <p>Controle de projetos, repasses e lucros</p>
    </div>
</header>

<div class="container">

<!-- CADASTRO -->
<div class="card">

    <h2>➕ Novo projeto</h2>

    <div class="grid">

        <div class="field full">
            <label>Cliente</label>
            <input id="cliente" type="text" placeholder="Nome do cliente">
        </div>

        <div class="field">
            <label>Data do projeto</label>
            <input id="data" type="date">
        </div>

        <div class="field">
            <label>Serviço</label>

            <select id="servico" onchange="atualizarValorServico()">

                <option value="">
                    Selecione o serviço
                </option>

                <option value="Consulta de disponibilidade" data-valor="30">
                    Consulta de disponibilidade
                </option>

                <option value="Projeto com estudo" data-valor="100">
                    Projeto com estudo
                </option>

                <option value="Projeto sem estudo" data-valor="150">
                    Projeto sem estudo
                </option>

                <option value="Estudo prévio de carga" data-valor="250">
                    Estudo prévio de carga
                </option>

            </select>
        </div>

        <div class="field">

            <label>Valor unitário (R$)</label>

            <input
                id="valorUnitario"
                type="number"
                step="0.01"
                readonly
                placeholder="0,00">

        </div>

        <div class="field">

            <label>Quantidade</label>

            <input
                id="quantidade"
                type="number"
                min="1"
                step="1"
                value="1"
                oninput="atualizarValorTotal()">

        </div>

        <div class="field">

            <label>Valor total do projeto (R$)</label>

            <input
                id="valor"
                type="number"
                step="0.01"
                readonly
                placeholder="0,00">

        </div>

        <div class="field">

            <label>Repasse aos parceiros (R$)</label>

            <input
                id="repasse"
                type="number"
                step="0.01"
                placeholder="0,00">

        </div>

    </div>

    <button
        class="btn-primary"
        onclick="adicionarProjeto()">

        SALVAR PROJETO

    </button>

</div>


<!-- FILTROS -->
<div class="card">

    <h2>🔎 Filtros</h2>

    <div class="filters">

        <div class="field">

            <label>Cliente</label>

            <select id="filtroCliente" onchange="renderizar()">

                <option value="">
                    Todos os clientes
                </option>

            </select>

        </div>

        <div class="field">

            <label>Data inicial</label>

            <input
                id="filtroInicio"
                type="date"
                onchange="renderizar()">

        </div>

        <div class="field">

            <label>Data final</label>

            <input
                id="filtroFim"
                type="date"
                onchange="renderizar()">

        </div>

        <button
            class="btn-secondary"
            onclick="limparFiltros()">

            Limpar

        </button>

    </div>

</div>


<!-- RESUMO -->
<div class="card">

    <h2>📊 Fechamento</h2>

    <div class="resumo">

        <div class="resumo-box">
            <span>Total dos projetos</span>
            <strong id="totalProjetos">R$ 0,00</strong>
        </div>

        <div class="resumo-box">
            <span>Total de repasses</span>
            <strong id="totalRepasses">R$ 0,00</strong>
        </div>

        <div class="resumo-box">
            <span>Lucro líquido</span>
            <strong id="totalLucro">R$ 0,00</strong>
        </div>

    </div>

</div>


<!-- LISTA -->
<div class="card">

    <h2>📁 Projetos cadastrados</h2>

    <div id="listaProjetos" class="lista"></div>

</div>

</div>


<script>

const CHAVE = "projetosDJ";

let projetos =
    JSON.parse(localStorage.getItem(CHAVE)) || [];


/* =========================
   FORMATAÇÃO
========================= */

function moeda(valor){

    return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );
}


function formatarData(data){

    if(!data) return "-";

    const partes = data.split("-");

    if(partes.length !== 3){
        return data;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


/* =========================
   SALVAR
========================= */

function salvar(){

    localStorage.setItem(
        CHAVE,
        JSON.stringify(projetos)
    );

}


/* =========================
   SERVIÇO / VALOR UNITÁRIO
========================= */

function atualizarValorServico(){

    const servico =
        document.getElementById("servico");

    const valorUnitario =
        document.getElementById("valorUnitario");

    const quantidade =
        document.getElementById("quantidade");


    const opcao =
        servico.options[servico.selectedIndex];


    if(
        !opcao ||
        !opcao.dataset.valor
    ){

        valorUnitario.value = "";
        document.getElementById("valor").value = "";

        return;
    }


    valorUnitario.value =
        opcao.dataset.valor;


    if(
        !quantidade.value ||
        Number(quantidade.value) < 1
    ){

        quantidade.value = 1;

    }


    atualizarValorTotal();

}


/* =========================
   VALOR TOTAL
========================= */

function atualizarValorTotal(){

    const valorUnitario =
        Number(
            document.getElementById(
                "valorUnitario"
            ).value || 0
        );


    let quantidade =
        Number(
            document.getElementById(
                "quantidade"
            ).value || 1
        );


    if(quantidade < 1){

        quantidade = 1;

        document.getElementById(
            "quantidade"
        ).value = 1;

    }


    const total =
        valorUnitario * quantidade;


    document.getElementById(
        "valor"
    ).value = total.toFixed(2);

}


/* =========================
   ADICIONAR PROJETO
========================= */

function adicionarProjeto(){

    const cliente =
        document.getElementById("cliente")
        .value
        .trim();


    const data =
        document.getElementById("data")
        .value;


    const servico =
        document.getElementById("servico")
        .value;


    const valorUnitario =
        Number(
            document.getElementById(
                "valorUnitario"
            ).value || 0
        );


    const quantidade =
        Number(
            document.getElementById(
                "quantidade"
            ).value || 1
        );


    const valor =
        Number(
            document.getElementById(
                "valor"
            ).value || 0
        );


    const repasse =
        Number(
            document.getElementById(
                "repasse"
            ).value || 0
        );


    if(!cliente){

        alert(
            "Informe o nome do cliente."
        );

        return;
    }


    if(!data){

        alert(
            "Informe a data do projeto."
        );

        return;
    }


    if(!servico){

        alert(
            "Selecione o serviço."
        );

        return;
    }


    if(quantidade < 1){

        alert(
            "A quantidade deve ser pelo menos 1."
        );

        return;
    }


    if(valor <= 0){

        alert(
            "O valor total do projeto é inválido."
        );

        return;
    }


    if(repasse < 0){

        alert(
            "O repasse não pode ser negativo."
        );

        return;
    }


    if(repasse > valor){

        alert(
            "O repasse não pode ser maior que o valor total do projeto."
        );

        return;
    }


    const projeto = {

        id: Date.now(),

        cliente: cliente,

        data: data,

        servico: servico,

        valorUnitario: valorUnitario,

        quantidade: quantidade,

        valor: valor,

        repasse: repasse,

        lucro: valor - repasse

    };


    projetos.push(projeto);

    salvar();


    /* LIMPAR FORMULÁRIO */

    document.getElementById(
        "cliente"
    ).value = "";


    document.getElementById(
        "data"
    ).value = "";


    document.getElementById(
        "servico"
    ).value = "";


    document.getElementById(
        "valorUnitario"
    ).value = "";


    document.getElementById(
        "quantidade"
    ).value = 1;


    document.getElementById(
        "valor"
    ).value = "";


    document.getElementById(
        "repasse"
    ).value = "";


    atualizarClientes();

    renderizar();


    alert(
        "Projeto salvo com sucesso!"
    );

}


/* =========================
   EXCLUIR
========================= */

function excluirProjeto(id){

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este projeto?"
        );


    if(!confirmar){
        return;
    }


    projetos =
        projetos.filter(
            p => p.id !== id
        );


    salvar();

    atualizarClientes();

    renderizar();

}


/* =========================
   CLIENTES
========================= */

function atualizarClientes(){

    const select =
        document.getElementById(
            "filtroCliente"
        );


    const valorAtual =
        select.value;


    const clientes =
        [...new Set(

            projetos
                .map(
                    p => p.cliente
                )
                .filter(Boolean)

        )]
        .sort(
            (a,b) =>
                a.localeCompare(b)
        );


    select.innerHTML =
        '<option value="">Todos os clientes</option>';


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente;


            option.textContent =
                cliente;


            select.appendChild(
                option
            );

        }
    );


    if(
        clientes.includes(
            valorAtual
        )
    ){

        select.value =
            valorAtual;

    }

}


/* =========================
   FILTROS
========================= */

function obterProjetosFiltrados(){

    const cliente =
        document.getElementById(
            "filtroCliente"
        ).value;


    const inicio =
        document.getElementById(
            "filtroInicio"
        ).value;


    const fim =
        document.getElementById(
            "filtroFim"
        ).value;


    return projetos.filter(
        p => {

            if(
                cliente &&
                p.cliente !== cliente
            ){
                return false;
            }


            if(
                inicio &&
                p.data < inicio
            ){
                return false;
            }


            if(
                fim &&
                p.data > fim
            ){
                return false;
            }


            return true;

        }
    );

}


/* =========================
   RENDERIZAR
========================= */

function renderizar(){

    const lista =
        document.getElementById(
            "listaProjetos"
        );


    const filtrados =
        obterProjetosFiltrados();


    let totalProjetos = 0;

    let totalRepasses = 0;

    let totalLucro = 0;


    filtrados.forEach(
        p => {

            const valor =
                Number(
                    p.valor || 0
                );


            const repasse =
                Number(
                    p.repasse || 0
                );


            const lucro =
                p.lucro !== undefined

                ? Number(p.lucro)

                : valor - repasse;


            totalProjetos += valor;

            totalRepasses += repasse;

            totalLucro += lucro;

        }
    );


    document.getElementById(
        "totalProjetos"
    ).textContent =
        moeda(totalProjetos);


    document.getElementById(
        "totalRepasses"
    ).textContent =
        moeda(totalRepasses);


    document.getElementById(
        "totalLucro"
    ).textContent =
        moeda(totalLucro);


    if(
        filtrados.length === 0
    ){

        lista.innerHTML = `

            <div class="vazio">
                Nenhum projeto encontrado.
            </div>

        `;

        return;

    }


    filtrados.sort(
        (a,b) =>
            b.data.localeCompare(
                a.data
            )
    );


    lista.innerHTML =

        filtrados.map(
            p => {

                const lucro =
                    p.lucro !== undefined

                    ? Number(p.lucro)

                    : Number(
                        p.valor || 0
                    )
                    -
                    Number(
                        p.repasse || 0
                    );


                const quantidade =
                    Number(
                        p.quantidade || 1
                    );


                const valorUnitario =
                    Number(
                        p.valorUnitario ||
                        (
                            quantidade > 0
                            ?
                            Number(p.valor || 0)
                            / quantidade
                            :
                            0
                        )
                    );


                return `

                    <div class="projeto">

                        <div class="projeto-topo">

                            <div>

                                <h3>
                                    ${escaparHTML(
                                        p.cliente
                                    )}
                                </h3>


                                <div class="servico-projeto">

                                    🔧
                                    ${
                                        p.servico
                                        ?
                                        escaparHTML(
                                            p.servico
                                        )
                                        :
                                        "Serviço"
                                    }

                                </div>


                                <div class="detalhes-servico">

                                    Quantidade:
                                    <strong>
                                        ${quantidade}
                                    </strong>

                                    &nbsp;|&nbsp;

                                    Unitário:
                                    <strong>
                                        ${moeda(
                                            valorUnitario
                                        )}
                                    </strong>

                                </div>


                                <div class="data">

                                    📅
                                    ${formatarData(
                                        p.data
                                    )}

                                </div>

                            </div>

                        </div>


                        <div class="valores">

                            <div class="valor-box">

                                <small>
                                    Total do projeto
                                </small>

                                <strong>
                                    ${moeda(
                                        p.valor
                                    )}
                                </strong>

                            </div>


                            <div class="valor-box">

                                <small>
                                    Repasse
                                </small>

                                <strong>
                                    ${moeda(
                                        p.repasse
                                    )}
                                </strong>

                            </div>


                            <div class="valor-box">

                                <small>
                                    Lucro
                                </small>

                                <strong>
                                    ${moeda(
                                        lucro
                                    )}
                                </strong>

                            </div>

                        </div>


                        <div class="acoes">

                            <button
                                class="btn-danger"
                                onclick="excluirProjeto(
                                    ${p.id}
                                )">

                                Excluir

                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================
   SEGURANÇA
========================= */

function escaparHTML(texto){

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   LIMPAR FILTROS
========================= */

function limparFiltros(){

    document.getElementById(
        "filtroCliente"
    ).value = "";


    document.getElementById(
        "filtroInicio"
    ).value = "";


    document.getElementById(
        "filtroFim"
    ).value = "";


    renderizar();

}


/* =========================
   INICIALIZAÇÃO
========================= */

atualizarClientes();

renderizar();

</script>

</body>
</html>
