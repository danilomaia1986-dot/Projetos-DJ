<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Projetos-DJ</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f4f6;
    color:#1f2937;
    padding:10px 7px 40px;
}

.container{
    max-width:850px;
    margin:auto;
}

.card{
    background:#ffffff;
    border-radius:25px;
    padding:28px 40px 35px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
}

h1{
    font-size:30px;
    margin-bottom:25px;
    color:#1f2937;
}

label{
    display:block;
    font-size:21px;
    font-weight:700;
    color:#374151;
    margin-top:22px;
    margin-bottom:10px;
}

input,
select{
    width:100%;
    height:64px;
    border:2px solid #d1d5db;
    border-radius:18px;
    padding:0 20px;
    font-size:20px;
    background:#fff;
    color:#111827;
    outline:none;
}

input:focus,
select:focus{
    border-color:#2864e8;
}

input[readonly]{
    background:#f3f4f6;
    color:#6b7280;
}

button{
    width:100%;
    height:62px;
    border:none;
    border-radius:18px;
    background:#2864e8;
    color:#fff;
    font-size:19px;
    font-weight:700;
    margin-top:28px;
    cursor:pointer;
}

button:active{
    transform:scale(.99);
}

.botao-excluir{
    background:#dc2626;
    height:46px;
    font-size:15px;
    margin-top:14px;
}

.item{
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:16px;
    margin-top:12px;
    background:#fff;
}

.item strong{
    display:block;
    font-size:18px;
    margin-bottom:7px;
}

.linha{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:6px;
}

.vazio{
    color:#6b7280;
    font-size:15px;
}

@media(max-width:600px){

    body{
        padding:10px 7px 30px;
    }

    .card{
        padding:24px 40px 30px;
    }

    h1{
        font-size:28px;
    }

    label{
        font-size:20px;
    }

    input,
    select{
        font-size:19px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- ================================================= -->
<!-- NOVO PROJETO -->
<!-- ================================================= -->

<div class="card">

<h1>Novo projeto</h1>


<!-- CLIENTE -->

<label for="cliente">
    Cliente
</label>

<input
    type="text"
    id="cliente"
    placeholder="Nome do cliente"
>


<!-- DATA -->

<label for="data">
    Data do projeto
</label>

<input
    type="date"
    id="data"
>


<!-- SERVIÇO -->

<label for="servico">
    Serviço
</label>

<select id="servico">

    <option value="">
        Selecione o serviço
    </option>

    <option value="Consulta de disponibilidade">
        Consulta de disponibilidade
    </option>

    <option value="Projeto com estudo">
        Projeto com estudo
    </option>

    <option value="Projeto sem estudo">
        Projeto sem estudo
    </option>

    <option value="Estudo prévio de carga">
        Estudo prévio de carga
    </option>

</select>


<!-- VALOR UNITÁRIO -->

<label for="valorUnitario">
    Valor unitário (R$)
</label>

<input
    type="text"
    id="valorUnitario"
    value="0,00"
    readonly
>


<!-- QUANTIDADE -->

<label for="quantidade">
    Quantidade
</label>

<input
    type="number"
    id="quantidade"
    value="1"
    min="1"
    step="1"
    inputmode="numeric"
>


<!-- VALOR TOTAL -->

<label for="valorTotal">
    Valor total do projeto (R$)
</label>

<input
    type="text"
    id="valorTotal"
    value="0,00"
    readonly
>


<!-- REPASSE -->

<label for="repasse">
    Repasse aos parceiros (R$)
</label>

<input
    type="number"
    id="repasse"
    value="0"
    min="0"
    step="0.01"
    inputmode="decimal"
>


<!-- BOTÃO -->

<button
    type="button"
    id="btnSalvar"
>
    SALVAR PROJETO
</button>

</div>



<!-- ================================================= -->
<!-- PROJETOS SALVOS -->
<!-- ================================================= -->

<div class="card">

<h1>Projetos salvos</h1>

<div id="listaProjetos"></div>

</div>


</div>



<script>

/* =====================================================
   TABELA DE PREÇOS
   ===================================================== */

const PRECOS = {

    "Consulta de disponibilidade": 30,

    "Projeto com estudo": 100,

    "Projeto sem estudo": 150,

    "Estudo prévio de carga": 250

};



/* =====================================================
   ELEMENTOS
   ===================================================== */

const cliente =
    document.getElementById("cliente");

const data =
    document.getElementById("data");

const servico =
    document.getElementById("servico");

const valorUnitario =
    document.getElementById("valorUnitario");

const quantidade =
    document.getElementById("quantidade");

const valorTotal =
    document.getElementById("valorTotal");

const repasse =
    document.getElementById("repasse");

const btnSalvar =
    document.getElementById("btnSalvar");

const listaProjetos =
    document.getElementById("listaProjetos");



/* =====================================================
   FORMATAR DINHEIRO
   ===================================================== */

function formatarDinheiro(valor){

    valor = Number(valor) || 0;

    return valor.toLocaleString("pt-BR", {

        minimumFractionDigits:2,

        maximumFractionDigits:2

    });

}



/* =====================================================
   PEGAR VALOR DO SERVIÇO
   ===================================================== */

function pegarPrecoServico(){

    const nomeServico = servico.value;

    if(!nomeServico){

        return 0;

    }

    return Number(PRECOS[nomeServico]) || 0;

}



/* =====================================================
   ATUALIZAR VALOR UNITÁRIO
   ===================================================== */

function atualizarValorUnitario(){

    const preco = pegarPrecoServico();

    valorUnitario.value =
        formatarDinheiro(preco);

    atualizarValorTotal();

}



/* =====================================================
   ATUALIZAR VALOR TOTAL
   ===================================================== */

function atualizarValorTotal(){

    let preco = pegarPrecoServico();

    let qtd = Number(quantidade.value);

    if(!Number.isFinite(qtd) || qtd < 1){

        qtd = 1;

        quantidade.value = 1;

    }

    const total = preco * qtd;

    valorTotal.value =
        formatarDinheiro(total);

}



/* =====================================================
   EVENTO AO SELECIONAR SERVIÇO
   ===================================================== */

servico.addEventListener(
    "change",
    function(){

        atualizarValorUnitario();

    }
);



/* =====================================================
   EVENTO AO ALTERAR QUANTIDADE
   ===================================================== */

quantidade.addEventListener(
    "input",
    function(){

        atualizarValorTotal();

    }
);



quantidade.addEventListener(
    "change",
    function(){

        atualizarValorTotal();

    }
);



/* =====================================================
   SALVAR PROJETO
   ===================================================== */

btnSalvar.addEventListener(
    "click",
    function(){

        const nomeCliente =
            cliente.value.trim();

        const dataProjeto =
            data.value;

        const nomeServico =
            servico.value;

        const preco =
            pegarPrecoServico();

        let qtd =
            Number(quantidade.value);

        const valorRepasse =
            Number(repasse.value) || 0;


        /* VALIDAR CLIENTE */

        if(!nomeCliente){

            alert(
                "Informe o nome do cliente."
            );

            cliente.focus();

            return;

        }


        /* VALIDAR SERVIÇO */

        if(!nomeServico){

            alert(
                "Selecione um serviço."
            );

            servico.focus();

            return;

        }


        /* VALIDAR QUANTIDADE */

        if(!Number.isFinite(qtd) || qtd < 1){

            qtd = 1;

        }


        /* CALCULAR TOTAL */

        const total =
            preco * qtd;


        /* PEGAR PROJETOS EXISTENTES */

        let projetos =
            JSON.parse(
                localStorage.getItem(
                    "projetosDJ"
                ) || "[]"
            );


        if(!Array.isArray(projetos)){

            projetos = [];

        }


        /* CRIAR PROJETO */

        const projeto = {

            id:Date.now(),

            cliente:nomeCliente,

            data:dataProjeto,

            servico:nomeServico,

            valorUnitario:preco,

            quantidade:qtd,

            valorTotal:total,

            repasse:valorRepasse

        };


        /* ADICIONAR */

        projetos.push(projeto);


        /* SALVAR */

        localStorage.setItem(

            "projetosDJ",

            JSON.stringify(projetos)

        );


        /* ATUALIZAR LISTA */

        mostrarProjetos();


        /* LIMPAR FORMULÁRIO */

        cliente.value = "";

        data.value = "";

        servico.value = "";

        valorUnitario.value = "0,00";

        quantidade.value = "1";

        valorTotal.value = "0,00";

        repasse.value = "0";


        alert(
            "Projeto salvo com sucesso!"
        );

    }
);



/* =====================================================
   MOSTRAR PROJETOS
   ===================================================== */

function mostrarProjetos(){

    let projetos =
        JSON.parse(
            localStorage.getItem(
                "projetosDJ"
            ) || "[]"
        );


    if(!Array.isArray(projetos)){

        projetos = [];

    }


    if(projetos.length === 0){

        listaProjetos.innerHTML =

            '<div class="vazio">' +
            'Nenhum projeto salvo.' +
            '</div>';

        return;

    }


    listaProjetos.innerHTML = "";


    projetos
        .slice()
        .reverse()
        .forEach(function(projeto){

            const item =
                document.createElement("div");

            item.className = "item";


            item.innerHTML = `

                <strong>
                    ${escapar(projeto.cliente)}
                </strong>

                <div>
                    ${escapar(projeto.servico)}
                </div>

                <div class="linha">
                    <span>Quantidade</span>
                    <b>
                        ${projeto.quantidade}
                    </b>
                </div>

                <div class="linha">
                    <span>Valor unitário</span>
                    <b>
                        R$ ${formatarDinheiro(
                            projeto.valorUnitario
                        )}
                    </b>
                </div>

                <div class="linha">
                    <span>Valor total</span>
                    <b>
                        R$ ${formatarDinheiro(
                            projeto.valorTotal
                        )}
                    </b>
                </div>

                <div class="linha">
                    <span>Repasse</span>
                    <b>
                        R$ ${formatarDinheiro(
                            projeto.repasse
                        )}
                    </b>
                </div>

                <button
                    type="button"
                    class="botao-excluir"
                    onclick="excluirProjeto(${projeto.id})"
                >
                    EXCLUIR
                </button>

            `;


            listaProjetos.appendChild(item);

        });

}



/* =====================================================
   EXCLUIR PROJETO
   ===================================================== */

function excluirProjeto(id){

    const confirmar =
        confirm(
            "Deseja excluir este projeto?"
        );


    if(!confirmar){

        return;

    }


    let projetos =
        JSON.parse(
            localStorage.getItem(
                "projetosDJ"
            ) || "[]"
        );


    projetos =
        projetos.filter(
            function(projeto){

                return projeto.id !== id;

            }
        );


    localStorage.setItem(

        "projetosDJ",

        JSON.stringify(projetos)

    );


    mostrarProjetos();

}



/* =====================================================
   PROTEGER TEXTO
   ===================================================== */

function escapar(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

mostrarProjetos();

atualizarValorUnitario();

</script>

</body>
</html>
